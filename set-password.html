<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور - MyStock</title>
  <script>
    (function() {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
  <form class="auth-box" id="set-pass-form">
    <h1>MyStock</h1>
    <p class="subtitle">تعيين كلمة مرور لحسابك</p>

    <div class="alert alert-error" id="pass-error" style="display:none;"></div>
    <div class="alert alert-success" id="pass-success" style="display:none;"></div>

    <p style="font-size: 13px; color: #6b7280; margin-bottom: 20px; text-align: center;">
      سيسمح لك هذا بتسجيل الدخول باستخدام بريدك الإلكتروني وكلمة المرور بدلاً من Google.
    </p>

    <div class="form-group">
      <label>كلمة المرور الجديدة *</label>
      <input type="password" id="new-password" required minlength="6" dir="ltr" placeholder="6 أحرف على الأقل">
    </div>

    <button type="submit" class="btn-primary" style="width:100%; justify-content:center;" id="save-pass-btn">
      <i class="fas fa-key"></i>
      <span>حفظ كلمة المرور</span>
    </button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // التأكد من أن المستخدم مسجل دخول
      const session = await window.authReadyPromise;
      if (!session?.user) {
        window.location.replace('/login.html');
        return;
      }

      document.getElementById('set-pass-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('new-password').value;
        const btn = document.getElementById('save-pass-btn');
        const errBox = document.getElementById('pass-error');
        const successBox = document.getElementById('pass-success');

        btn.disabled = true;
        errBox.style.display = 'none';
        successBox.style.display = 'none';

        // ✅ إضافة كلمة المرور للحساب
        const { error } = await db.auth.updateUser({ password: newPassword });

        if (error) {
          errBox.textContent = error.message;
          errBox.style.display = 'block';
          btn.disabled = false;
        } else {
          successBox.textContent = '✅ تم تعيين كلمة المرور بنجاح! جارٍ تحويلك...';
          successBox.style.display = 'block';
          setTimeout(() => window.location.href = '/profile-dashboard.html', 1500);
        }
      });
    });
  </script>
</body>
</html>
