<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStock</title>

  <meta name="robots" content="noindex, nofollow">

  <!-- ✅ تطبيق اللغة والاتجاه فوراً قبل أي CSS لمنع وميض اللغة -->
  <script>
    (function() {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/common.css?v=11">
  <link rel="stylesheet" href="/assets/css/pages/register.css?v=14">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="register-page">
  <form class="auth-box" id="register-form">
    <h1>MyStock</h1>
    <p class="subtitle" data-i18n="register_title">إنشاء حساب جديد</p>

    <div class="alert alert-error" id="reg-error" style="display:none;"></div>
    <div class="alert alert-success" id="reg-success" style="display:none;"></div>

    <div class="section-title" data-i18n="register_personal_info">المعلومات الشخصية</div>

    <div class="row-2">
      <div class="form-group">
        <label data-i18n="register_first_name">الإسم الشخصي *</label>
        <input type="text" id="first_name" required>
      </div>
      <div class="form-group">
        <label data-i18n="register_last_name">الإسم العائلي *</label>
        <input type="text" id="last_name" required>
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="register_org_name">إسم المنظمة *</label>
      <input type="text" id="org_name" required>
    </div>

    <!-- ✅ قائمة اختيار البلد -->
    <div class="form-group">
      <label data-i18n="welcome_country">البلد *</label>
      <div class="picker" id="country-picker">
        <button type="button" class="picker-trigger" id="country-trigger">
          <span class="picker-flag" id="country-flag"></span>
          <!-- ✅ تم إزالة data-i18n من هنا لكي لا يتدخل ملف الترجمة -->
          <span class="picker-name" id="country-name">-- اختر البلد --</span>
          <i class="fas fa-chevron-down picker-arrow"></i>
        </button>
        <div class="picker-dropdown" id="country-dropdown"></div>
      </div>
      <input type="hidden" id="country_code" name="country_code">
    </div>

    <!-- ✅ حقل رقم الهاتف الموحد -->
    <div class="form-group">
      <label data-i18n="register_phone">رقم الهاتف *</label>
      <div class="phone-input-wrapper">
        <span class="phone-flag" id="phone-flag"></span>
        <span class="phone-dial-code" id="phone-dial-code" dir="ltr">+212</span>
        <input type="tel" id="phone" placeholder="600000000" required dir="ltr">
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="register_email">البريد الإلكتروني *</label>
      <input type="email" id="email" required dir="ltr">
    </div>

    <div class="form-group">
      <label data-i18n="register_password">كلمة السر *</label>
      <div class="password-wrapper">
        <input type="password" id="password" required minlength="6" dir="ltr">
        <button type="button" class="toggle-password" data-target="password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="register_password_confirm">تأكيد كلمة السر *</label>
      <div class="password-wrapper">
        <input type="password" id="password_confirm" required minlength="6" dir="ltr">
        <button type="button" class="toggle-password" data-target="password_confirm">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="section-title" data-i18n="register_or">أو</div>

    <button type="button" class="google-btn" disabled>
      <i class="fab fa-google"></i>
      <span data-i18n="register_google">المتابعة باستخدام Google (قريباً)</span>
    </button>

    <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top: 20px;" id="register-btn">
      <i class="fas fa-user-plus"></i>
      <span data-i18n="register_button">تسجيل</span>
    </button>

    <div class="auth-footer">
      <p data-i18n="register_have_account">لديك حساب؟</p>
      <a href="/login.html" class="btn-secondary" style="width:100%; justify-content:center;">
        <i class="fas fa-right-to-bracket"></i>
        <span data-i18n="register_login">تسجيل الدخول</span>
      </a>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase.js"></script>
  <script src="/js/core/i18n.js?v=11"></script>
  <script src="/js/core/register.js?v=13"></script> 
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.applyLanguage) await window.applyLanguage();
    });
  </script>
</body>
</html>
