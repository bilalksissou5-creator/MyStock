<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStock</title>

  <!-- ✅ تطبيق اللغة والاتجاه فوراً قبل أي CSS لمنع وميض اللغة -->
  <script>
    (function() {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>
  <script src="/js/core/supabase.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/core/notifications.js"></script>
  <script src="/js/components/layout.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      
      // ✅ 1. تفعيل الترجمة أولاً
      if (window.applyLanguage) {
        await window.applyLanguage();
      }

      // ✅ 2. تفعيل "شرطي المرور" (إذا لم يكن مفعلاً في dashboard.js)
      // هذا السطر سيقرر ما إذا كان المستخدم يجب أن يبقى هنا أو يذهب لإكمال البيانات أو الاشتراك
      if (typeof requireAuth === 'function') {
        await requireAuth();
      }
      
      // ✅ 3. تشغيل الإشعارات
      if (typeof startNotifPolling === 'function') {
        startNotifPolling();
      }
    });
  </script>
</body>
</html>
