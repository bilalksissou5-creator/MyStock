<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>MyStock</title>

  <!-- ✅ تشغيل اللغة فوراً قبل CSS -->
  <script src="/js/core/lang-boot.js"></script>

  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/welcome.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="welcome-page">

  <div class="welcome-container">

    <header class="welcome-header">
      <div class="welcome-logo-icon">
        <i class="fas fa-boxes-stacked"></i>
      </div>
      <h1 class="welcome-title">MyStock</h1>
      <p class="welcome-subtitle" data-i18n="app_tagline">نظام إدارة المخزون</p>
    </header>

    <!-- اختيار اللغة -->
    <section class="welcome-section">
      <h2 class="section-label" data-i18n="welcome_language">اللغة</h2>
      <div class="picker" id="lang-picker">
        <button type="button" class="picker-trigger" id="lang-trigger">
          <span class="picker-flag" id="lang-flag">🇲🇦</span>
          <span class="picker-name" id="lang-name">العربية</span>
          <i class="fas fa-chevron-down picker-arrow"></i>
        </button>
        <div class="picker-dropdown" id="lang-dropdown">
          <button type="button" class="picker-option" data-lang="ar">
            <span class="picker-flag">🇲🇦</span>
            <span class="picker-name">العربية</span>
            <i class="fas fa-check picker-check"></i>
          </button>
          <button type="button" class="picker-option" data-lang="fr">
            <span class="picker-flag">🇫🇷</span>
            <span class="picker-name">Français</span>
            <i class="fas fa-check picker-check"></i>
          </button>
          <button type="button" class="picker-option" data-lang="en">
            <span class="picker-flag">🇬🇧</span>
            <span class="picker-name">English</span>
            <i class="fas fa-check picker-check"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- اختيار البلد -->
    <section class="welcome-section">
      <h2 class="section-label" data-i18n="welcome_country">البلد</h2>
      <div class="picker" id="country-picker">
        <button type="button" class="picker-trigger" id="country-trigger">
          <span class="picker-flag" id="country-flag">🌍</span>
          <span class="picker-name" id="country-name" data-i18n="welcome_select_country">-- اختر البلد --</span>
          <i class="fas fa-chevron-down picker-arrow"></i>
        </button>
        <div class="picker-dropdown" id="country-dropdown"></div>
      </div>
    </section>

  </div>

  <div class="welcome-footer">
    <button type="button" class="welcome-btn" id="continue-btn" disabled>
      <span data-i18n="welcome_continue">متابعة</span>
      <i class="fas fa-arrow-left"></i>
    </button>
  </div>

  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/welcome.js"></script>
</body>
</html>
