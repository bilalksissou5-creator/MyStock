<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStock - Login</title>

  <meta name="robots" content="noindex, nofollow">

  <script>
    (function() {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/common.css?v=14">
  <link rel="stylesheet" href="/assets/css/pages/login.css?v=14">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
  <form class="auth-box" id="login-form">
    <h1>MyStock</h1>
    <p class="subtitle" data-i18n="app_tagline">نظام إدارة المخزون</p>

    <div class="alert alert-error" id="login-error" style="display:none;"></div>

    <div class="form-group">
      <label data-i18n="login_email">البريد الإلكتروني</label>
      <input type="email" id="email" required dir="ltr">
    </div>

    <div class="form-group">
      <label data-i18n="login_password">كلمة السر</label>
      <div class="password-wrapper">
        <input type="password" id="password" required dir="ltr">
        <button type="button" class="toggle-password" id="toggle-password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary" style="width:100%; justify-content:center;" id="login-btn">
      <i class="fas fa-right-to-bracket"></i>
      <span data-i18n="login_button">دخول</span>
    </button>

    <div class="auth-footer">
      <p data-i18n="login_no_account">ليس لديك حساب؟</p>
      
      <a href="/register.html" class="btn-secondary" style="width:100%; justify-content:center;">
        <i class="fas fa-user-plus"></i>
        <span data-i18n="login_create_account">إنشاء حساب جديد</span>
      </a>

      <div style="margin: 15px 0; text-align: center; color: #a3a3a3; font-size: 13px; display: flex; align-items: center; gap: 10px;">
        <span style="flex: 1; height: 1px; background: #e5e5e5;"></span>
        <span>أو</span>
        <span style="flex: 1; height: 1px; background: #e5e5e5;"></span>
      </div>

      <!-- ✅ زر Google يفتح صفحة إكمال البيانات أولاً -->
      <a href="/complete-profile.html" class="btn-secondary" style="width:100%; justify-content:center; display: flex; align-items: center; gap: 10px; background: white; border: 1px solid #d4d4d4; color: #171717; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>المتابعة باستخدام Google</span>
      </a>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase.js"></script>
  <script src="/js/core/i18n.js?v=14"></script>
  <script src="/js/core/auth.js?v=14"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.applyLanguage) await window.applyLanguage();

      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleBtn.innerHTML = isPassword
            ? '<i class="fas fa-eye-slash"></i>'
            : '<i class="fas fa-eye"></i>';
        });
      }
    });
  </script>
</body>
</html>
