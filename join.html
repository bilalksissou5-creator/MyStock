<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStock</title>

  <script>
    (function() {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/join.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="join-page">
    <div class="join-logo">
      <i class="fas fa-boxes-stacked"></i>
      <h1>MyStock</h1>
    </div>

    <div class="join-card">
      <h2 data-i18n="jn_title">الانضمام للفريق</h2>
      <p class="join-subtitle" data-i18n="jn_subtitle">أدخل الكود المُرسل إليك من المدير</p>

      <div class="alert alert-error" id="join-error" style="display:none;"></div>
      <div class="alert alert-success" id="join-success" style="display:none;"></div>

      <div class="form-group">
        <label data-i18n="jn_code">كود الدعوة *</label>
        <input type="text" id="invite-code" placeholder="000000" maxlength="6" 
               inputmode="numeric" pattern="[0-9]*" dir="ltr"
               style="text-align:center; font-size:24px; letter-spacing:12px; font-weight:700;">
      </div>

      <div class="form-group">
        <label data-i18n="jn_full_name">الاسم الكامل *</label>
        <input type="text" id="full-name" placeholder="اسمك الكامل...">
      </div>

      <div class="form-group">
        <label data-i18n="register_email">البريد الإلكتروني *</label>
        <input type="email" id="email" placeholder="email@example.com" dir="ltr">
      </div>

      <div class="form-group">
        <label data-i18n="register_password">كلمة المرور *</label>
        <input type="password" id="password" placeholder="6 أحرف على الأقل" dir="ltr">
      </div>

      <button type="button" class="btn-primary join-submit" id="join-btn">
        <i class="fas fa-user-plus"></i>
        <span data-i18n="rw_create_account">إنشاء حسابي</span>
      </button>

      <p class="join-footer">
        <span data-i18n="register_have_account">لديك حساب؟</span> <a href="/login.html" data-i18n="register_login">تسجيل الدخول</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/auth.js"></script>
  <script src="/js/pages/join.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.applyLanguage) applyLanguage();
    });
  </script>
</body>
</html>
