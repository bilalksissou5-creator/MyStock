<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>جاري تسجيل الدخول...</title>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif;">
  <div style="text-align:center;">
    <h2>جاري التحقق من حسابك...</h2>
    <p>يرجى الانتظار لحظة.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase.js"></script>
  <script>
    // هذه الدالة تنتظر Supabase لإنشاء الجلسة ثم تحولك للوحة التحكم
    document.addEventListener('DOMContentLoaded', async () => {
      // ننتظر قليلاً ليقوم Supabase بمعالجة الرمز الموجود في الرابط
      setTimeout(async () => {
        const { data: { session } } = await db.auth.getSession();
        
        if (session) {
          // إذا تم إنشاء الجلسة بنجاح، انتقل إلى لوحة التحكم
          window.location.replace('/dashboard.html');
        } else {
          // إذا فشل إنشاء الجلسة، عد إلى صفحة الدخول
          window.location.replace('/login.html');
        }
      }, 1000); // انتظار ثانية واحدة
    });
  </script>
</body>
</html>
