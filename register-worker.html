<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStock</title>

  <script>
    (function() {
      var lang = localStorage.getItem('app_lang') || 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/pages/register.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="register-page">
  <form class="auth-box" id="register-worker-form">
    <h1>MyStock</h1>
    <p class="subtitle" data-i18n="rw_subtitle">الانضمام إلى الفريق</p>

    <div class="alert alert-error" id="reg-error" style="display:none;"></div>
    <div class="alert alert-success" id="reg-success" style="display:none;"></div>

    <div class="section-title" data-i18n="rw_personal_info">معلوماتك الشخصية</div>

    <div class="row-2">
      <div class="form-group">
        <label data-i18n="register_first_name">الإسم الشخصي *</label>
        <input type="text" id="first_name" required>
      </div>
      <div class="form-group">
        <label data-i18n="register_last_name">الإسم العائلي *</label>
        <input type="text" id="last_name" required>
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="rw_phone">رقم الهاتف *</label>
      <input type="tel" id="phone" required dir="ltr" placeholder="+212 6XX XXX XXX">
    </div>

    <div class="form-group">
      <label data-i18n="register_email">البريد الإلكتروني *</label>
      <input type="email" id="email" required dir="ltr" placeholder="email@example.com">
      <small id="email-hint" style="display:none; color:#737373; font-size:11px; margin-top:4px; display:block;">
        <span data-i18n="rw_email_locked">🔒 مُملَّأ من الدعوة</span>
      </small>
    </div>

    <div class="form-group">
      <label data-i18n="register_password">كلمة السر *</label>
      <div class="password-wrapper">
        <input type="password" id="password" required minlength="6" dir="ltr">
        <button type="button" class="toggle-password" data-target="password">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label data-i18n="register_password_confirm">تأكيد كلمة السر *</label>
      <div class="password-wrapper">
        <input type="password" id="password_confirm" required minlength="6" dir="ltr">
        <button type="button" class="toggle-password" data-target="password_confirm">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top: 20px;" id="register-btn">
      <i class="fas fa-user-plus"></i>
      <span data-i18n="rw_create_account">إنشاء حسابي</span>
    </button>

    <div class="auth-footer">
      <p data-i18n="register_have_account">لديك حساب؟</p>
      <a href="/login.html" class="btn-secondary" style="width:100%; justify-content:center;">
        <i class="fas fa-right-to-bracket"></i>
        <span data-i18n="register_login">تسجيل الدخول</span>
      </a>
    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/core/supabase.js"></script>
  <script src="/js/core/i18n.js"></script>
  <script src="/js/core/register-worker.js"></script>
</body>
</html>
